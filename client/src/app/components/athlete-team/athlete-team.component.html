<h2>Просмотр команды</h2>
<ng-container *ngIf="athleteTeam$ | async as team">
  <p><strong>Название:</strong> {{ team?.name }}</p>
  <p><strong>Тип:</strong> {{ team.sex | toEnumName }}</p>

  <div class="mat-elevation-z8 table">
    <div class="tool-panel" style="width: 100%;">
      <div style="display:flex; justify-content: end; align-items:center; margin-bottom: 16px; min-width: 200px">
        <button mat-flat-button color="primary" (click)="onEdit()">Редактировать</button>
        <button mat-flat-button color="primary" (click)="onAddAthlete()">Добавить участника</button>
      </div>
    </div>
    <table mat-table [dataSource]="dataSource" matSort class="full-width-table">
      <ng-container matColumnDef="member">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Участник</th>
        <td mat-cell *matCellDef="let item"> {{ item.name }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Действия</th>
        <td mat-cell *matCellDef="let item">
          <mat-icon (click)="onDeleteAthlete(item)">delete</mat-icon>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 100]" showFirstLastButtons></mat-paginator>
  </div>

</ng-container>
