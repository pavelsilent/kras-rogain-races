<div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 16px;">
  <h2 *ngIf="!isSelectMode">Список команд</h2>
  <h3 *ngIf="isSelectMode">Выберите команду...</h3>
  <button *ngIf="!isSelectMode" mat-flat-button color="primary" (click)="onAdd()">Добавить команду</button>
</div>

<div class="mat-elevation-z8 table">
  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Поиск</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Введите название">
  </mat-form-field>

  <table mat-table
         [ngClass]="{'table-wrapper': isSelectMode}"
         [dataSource]="dataSource"
         matSort
         (select)="onSelectAthleteTeam($event)">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Название</th>
      <td mat-cell *matCellDef="let team">
        <a [routerLink]="['/teams', team.id]">{{ team.name }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="sex">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Тип</th>
      <td mat-cell *matCellDef="let athlete"> {{ athlete.sex | toEnumName }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        [ngClass]="{'clickable-row': isSelectMode, 'selected-row': row.id === selected?.id}"
        (click)="onSelectAthleteTeam(row)"

    ></tr>

  </table>

  <mat-paginator [pageSizeOptions]="[10, 100]" showFirstLastButtons></mat-paginator>
</div>
